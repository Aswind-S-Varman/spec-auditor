[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-auditor"
version = "0.1.0"
description = "LLM-based quality auditor for requirement specifications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.35"]
gemini = ["google-genai>=1.0"]


[project.scripts]
spec-auditor = "spec_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


